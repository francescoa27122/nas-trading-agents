name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # ubuntu, not windows, and deliberately: execute-trades.js spawns `claude`
    # with no shell, so the test's stub is only reachable on a POSIX platform.
    # On Windows a large part of the suite SKIPs. See the README.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Hardcoded on purpose, unlike the sibling quantdesk repo where the test
      # job derives its Python from docker/Dockerfile. There is no Dockerfile,
      # package.json or .nvmrc here, so this literal IS the only declaration —
      # there is nothing for it to drift against. If a container or a
      # package.json ever appears, derive it from that instead.
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      - name: Syntax-check every script
        run: |
          for f in *.js tests/*.js; do node --check "$f"; done
          for f in *.sh; do bash -n "$f"; done
          for f in agents/*/agent.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done

      - name: Trade executor tests
        run: node tests/execute-trades.test.js

      # A skipped run must never read as a clean one. On Linux nothing should
      # skip, so treat any SKIP here as a regression in the harness.
      - name: Assert full coverage ran
        run: |
          node tests/execute-trades.test.js | tee out.txt
          if grep -q 'SKIP' out.txt; then
            echo "::error::checks were skipped on Linux — the stub harness regressed"
            exit 1
          fi

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # startup.sh and run-agent.sh are load-bearing for every agent: a syntax
      # or quoting error in either takes the whole platform down silently.
      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning startup.sh run-agent.sh
