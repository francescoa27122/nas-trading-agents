name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **If this is a security problem, stop** — use private reporting
        (Security → Report a vulnerability). See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Actual behaviour, and what you expected instead.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Smallest reproduction
    validations: { required: true }
  - type: textarea
    id: output
    attributes:
      label: Real output
      description: Verbatim. Do not summarise.
      render: shell
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["linux", "macos", "windows", "container"]
    validations: { required: true }
  - type: checkboxes
    id: scrub
    attributes:
      label: Before you submit
      options:
        - label: I removed API keys, account balances, holdings and personal data from the output above
          required: true
